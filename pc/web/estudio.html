<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estudio del orbe</title>
  <!-- Solo para pruebas (pruebas/estudio_orbe.py): el orbe sobre un fondo fijo para capturarlo -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: var(--fondo, #0b0d11); }
    body.claro { background: linear-gradient(135deg, #dfe4ea, #c9d1da); }
    body.escritorio { background: linear-gradient(160deg, #1d2b3a 0%, #35506b 45%, #8aa3b8 100%); }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="orbe"></canvas>
  <script>
    const p = new URLSearchParams(location.search);
    if (p.get("fondo")) document.body.classList.add(p.get("fondo"));
  </script>
  <script type="module" src="orbe.js"></script>
</body>
</html>
