<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02050a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jarvis">
  <title>Jarvis</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app" data-state="idle">

    <!-- Secuencia de arranque -->
    <div class="boot" id="boot" aria-hidden="true"><div class="boot-lines" id="bootLines"></div></div>

    <!-- Cabecera -->
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="4.5" fill="currentColor" stroke="none"/>
          <circle cx="16" cy="16" r="9.5" stroke-opacity=".65"/>
          <ellipse cx="16" cy="16" rx="14" ry="5" stroke-opacity=".5" transform="rotate(-28 16 16)"/>
        </svg>
        <div class="brand-text">
          <b>J.A.R.V.I.S</b>
          <small id="sysLine">EN LÍNEA</small>
        </div>
      </div>
      <div class="topbar-right">
        <div class="pill" id="conn" data-state="demo"><span class="pill-dot"></span><span id="connText">Demo</span></div>
        <button class="icon-btn" id="openSettings" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <main class="views">

      <!-- ============ INICIO: EL ORBE ============ -->
      <section class="view active" id="view-home" aria-label="Jarvis">

        <div class="stage" id="stage" role="button" tabindex="0" aria-label="Toca el orbe para hablar con Jarvis">
          <svg class="hud-rings" viewBox="0 0 400 400" aria-hidden="true">
            <g class="spin spin-a"><circle cx="200" cy="200" r="194" stroke-opacity=".28" stroke-dasharray="1.5 7"/></g>
            <g class="spin spin-b"><circle cx="200" cy="200" r="181" stroke-width="7" stroke-opacity=".16" stroke-dasharray="1 8.9"/></g>
            <g class="spin spin-c"><circle cx="200" cy="200" r="168" stroke-width="1.6" stroke-opacity=".55" stroke-dasharray="86 190 34 112 20 160"/></g>
            <circle cx="200" cy="200" r="154" stroke-opacity=".10"/>
          </svg>
          <canvas id="orb" aria-hidden="true"></canvas>

          <div class="tele tl"><span>CPU</span><b id="teleCpu">–</b></div>
          <div class="tele tr"><span>RAM</span><b id="teleRam">–</b></div>
          <div class="tele bl"><span>TEMP</span><b id="teleTemp">–</b></div>
          <div class="tele br"><span>ENLACE</span><b id="teleLink">DEMO</b></div>
        </div>

        <div class="readout" id="readout">
          <div class="state" id="orbStatus">TOCA PARA HABLAR</div>
          <div class="heard" id="heard"></div>
          <div class="reply" id="reply"></div>
          <div class="tasks" id="tasks"></div>
        </div>

        <div class="chips" id="chips">
          <button class="chip" data-text="¿Cómo está el PC?">Estado del PC</button>
          <button class="chip" data-text="Activa el modo gaming">Modo gaming</button>
          <button class="chip" data-text="Abre Spotify">Abre Spotify</button>
          <button class="chip" data-text="Haz una captura de pantalla">Captura</button>
          <button class="chip" data-text="Bloquea el PC">Bloquear</button>
        </div>

        <form class="textbar" id="textbar" hidden autocomplete="off">
          <input id="textInput" type="text" placeholder="Escribe una orden…" enterkeyhint="send" autocapitalize="sentences" aria-label="Orden para Jarvis">
          <button type="submit" class="send" aria-label="Enviar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>

        <div class="dock">
          <button class="dock-btn" id="dockKeyboard" aria-label="Escribir una orden">
            <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
          </button>
          <button class="dock-btn" id="dockSpeaker" aria-label="Respuestas en voz alta" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5zM15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>
          </button>
          <button class="dock-btn" id="dockHistory" aria-label="Registro de conversación">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          </button>
        </div>
      </section>

      <!-- ============ CONTROL ============ -->
      <section class="view" id="view-control" aria-label="Panel de control">
        <div class="scroll">
          <h2 class="sect">Estado del sistema</h2>
          <div class="gauges" id="gauges">
            <div class="gauge hud" data-key="cpu">
              <div class="g-ring"><svg viewBox="0 0 80 80"><circle class="g-track" cx="40" cy="40" r="32"/><circle class="g-arc" cx="40" cy="40" r="32"/></svg></div>
              <div class="g-text"><span>CPU</span><b class="g-val">–</b></div>
            </div>
            <div class="gauge hud" data-key="ram">
              <div class="g-ring"><svg viewBox="0 0 80 80"><circle class="g-track" cx="40" cy="40" r="32"/><circle class="g-arc" cx="40" cy="40" r="32"/></svg></div>
              <div class="g-text"><span>MEMORIA</span><b class="g-val">–</b></div>
            </div>
            <div class="gauge hud" data-key="temp">
              <div class="g-ring"><svg viewBox="0 0 80 80"><circle class="g-track" cx="40" cy="40" r="32"/><circle class="g-arc" cx="40" cy="40" r="32"/></svg></div>
              <div class="g-text"><span>TEMPERATURA</span><b class="g-val">–</b></div>
            </div>
            <div class="gauge hud" data-key="disk">
              <div class="g-ring"><svg viewBox="0 0 80 80"><circle class="g-track" cx="40" cy="40" r="32"/><circle class="g-arc" cx="40" cy="40" r="32"/></svg></div>
              <div class="g-text"><span>DISCO</span><b class="g-val">–</b></div>
            </div>
          </div>
          <p class="uptime" id="uptime">TIEMPO ENCENDIDO · –</p>

          <h2 class="sect">Escenas</h2>
          <div class="grid2" id="scenes">
            <button class="panel-btn hud" data-scene="gaming">
              <svg viewBox="0 0 24 24"><path d="M7 8h10a5 5 0 0 1 5 5v1.5a3 3 0 0 1-5.3 1.9L15 14.5H9l-1.7 1.9A3 3 0 0 1 2 14.5V13a5 5 0 0 1 5-5z"/><path d="M8 10.5v3M6.5 12h3"/><path d="M15.5 11.5h.01M17.5 13.5h.01"/></svg>
              <strong>Gaming</strong><small>Epic · Discord · Spotify</small>
            </button>
            <button class="panel-btn hud" data-scene="trabajo">
              <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19.5h20"/></svg>
              <strong>Trabajo</strong><small>VS Code · Navegador · Obsidian</small>
            </button>
            <button class="panel-btn hud" data-scene="cine">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>
              <strong>Cine</strong><small>Pantalla completa · Volumen alto</small>
            </button>
            <button class="panel-btn hud" data-scene="noche">
              <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
              <strong>Noche</strong><small>Brillo bajo · Sin avisos</small>
            </button>
          </div>

          <h2 class="sect">Acciones rápidas</h2>
          <div class="grid3" id="actions">
            <button class="action hud" data-action="lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Bloquear</button>
            <button class="action hud" data-action="mute"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9l4 6M21 9l-4 6"/></svg>Silenciar</button>
            <button class="action hud" data-action="screenshot"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M9 6l1.5-2h3L15 6"/></svg>Captura</button>
            <button class="action hud" data-action="sleep" data-confirm="¿Suspender el PC? Tendrás que despertarlo en persona."><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>Suspender</button>
            <button class="action hud danger" data-action="reboot" data-confirm="¿Reiniciar el PC? Se cerrarán las apps abiertas."><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>Reiniciar</button>
            <button class="action hud danger" data-action="shutdown" data-confirm="¿Apagar el PC? No podrás volver a encenderlo desde el móvil."><svg viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>Apagar</button>
          </div>
        </div>
      </section>

      <!-- ============ TERMINAL ============ -->
      <section class="view" id="view-terminal" aria-label="Terminal">
        <div class="term-head"><span class="dot"></span><span id="termHost">jarvis@thinkcentre-m920q</span><em id="termMode">DEMO</em></div>
        <div class="term hud" id="term"></div>
        <div class="term-chips" id="termChips">
          <button class="chip mono" data-cmd="uptime">uptime</button>
          <button class="chip mono" data-cmd="free -h">free -h</button>
          <button class="chip mono" data-cmd="df -h">df -h</button>
          <button class="chip mono" data-cmd="ls">ls</button>
          <button class="chip mono" data-cmd="ollama list">ollama list</button>
        </div>
        <form class="term-form" id="termForm" autocomplete="off">
          <span class="prompt">$</span>
          <input id="termInput" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="escribe un comando" aria-label="Comando">
          <button type="submit" class="send" aria-label="Ejecutar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>
      </section>
    </main>

    <!-- Barra inferior -->
    <nav class="tabbar" role="tablist" aria-label="Secciones">
      <button class="tab active" role="tab" data-view="home" aria-selected="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8" stroke-opacity=".7"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22" stroke-opacity=".7"/></svg><span>Jarvis</span>
      </button>
      <button class="tab" role="tab" data-view="control" aria-selected="false">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Control</span>
      </button>
      <button class="tab" role="tab" data-view="terminal" aria-selected="false">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg><span>Terminal</span>
      </button>
    </nav>

    <div class="toast" id="toast" role="status"></div>
  </div>

  <!-- Confirmación -->
  <dialog id="confirmDialog">
    <form method="dialog" class="sheet">
      <h3>Confirmar acción</h3>
      <p id="confirmText"></p>
      <div class="sheet-actions">
        <button value="cancel" class="btn">Cancelar</button>
        <button value="ok" class="btn btn-danger" id="confirmOk">Confirmar</button>
      </div>
    </form>
  </dialog>

  <!-- Registro de conversación -->
  <dialog id="historyDialog">
    <form method="dialog" class="sheet">
      <h3>Registro</h3>
      <div class="log" id="historyList"></div>
      <div class="sheet-actions">
        <button type="button" class="btn btn-ghost" id="clearChat">Borrar registro</button>
        <button value="close" class="btn">Cerrar</button>
      </div>
    </form>
  </dialog>

  <!-- Ajustes -->
  <dialog id="settingsDialog">
    <form method="dialog" class="sheet" id="settingsForm">
      <h3>Ajustes</h3>

      <label class="row">
        <span>Modo demo<small>Respuestas simuladas, sin servidor</small></span>
        <input type="checkbox" id="setDemo" class="switch">
      </label>

      <label class="field">
        <span>Dirección del servidor</span>
        <input type="url" id="setUrl" placeholder="vacío = este mismo servidor" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>

      <label class="field">
        <span>Token de acceso</span>
        <input type="password" id="setToken" autocomplete="off" placeholder="••••••••" autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>

      <label class="row">
        <span>Respuestas en voz alta<small>Jarvis lee sus respuestas</small></span>
        <input type="checkbox" id="setTts" class="switch">
      </label>

      <div class="sheet-actions">
        <button value="cancel" class="btn">Cerrar</button>
        <button value="save" class="btn btn-primary" id="saveSettings">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
